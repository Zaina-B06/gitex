[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebound_engine"
version = "0.1.0"
description = "Rebound adaptive behaviour-change engine (pure Python)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Only needed to load a trained lapse-risk model (Task 02b); the engine runs without it.
risk = ["scikit-learn>=1.4", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["rebound_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
