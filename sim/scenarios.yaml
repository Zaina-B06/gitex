# Scenario overrides on config.yaml (deep-merged). Each scenario changes only the keys it lists here
# (checked by sim/tests/test_drop2.py). Reasons for each value: docs/ASSUMPTIONS.md, "Scenarios".
baseline: {}

ramadan_heavy:
  personas: {fasting_rate: 0.70}
  disruptions: {ramadan_days: [20, 49]}

hot_summer:
  disruptions: {heat_days: [1, 60], heat_penalty: 2.0}

low_checkin:
  traits: {checkin_rate_multiplier: 0.5}

high_dropout:
  behaviour: {dropout_silent_days: 7}
  traits: {motivation_mean: [-0.5, 0.8]}

shock_heavy:
  disruptions: {shocks: {rate: 3.0}}

# Harsher attrition for arm A (~30% week-12 persistence, ~40% retention targets); values found on seed 101.
harsh_attrition:
  behaviour: {open_base: 1.25}
  traits: {novelty_drop: [0.0, 3.0]}
